<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>注文詳細</title>
  <style>
    body { font-family: sans-serif; margin: 24px; }
    .search-bar { display: flex; gap: 12px; margin-bottom: 20px; }
    #detailPanel { display: none; }
    .info-grid { display: grid; grid-template-columns: 160px 1fr; gap: 6px 12px; margin-bottom: 20px; }
    .info-grid .label { font-weight: bold; color: #555; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px 12px; }
    th { background: #f0f0f0; }
    td.num { text-align: right; }
    #totalRow td { font-weight: bold; background: #fafafa; }
    #errorMsg { color: red; display: none; margin-top: 8px; }
  </style>
</head>
<body>
  <h2>注文詳細照会</h2>
  <div class="search-bar">
    <input type="text" id="orderIdInput" placeholder="注文ID（例：ORD-0001）" style="width:240px; padding:6px;">
    <button id="searchBtn">検索</button>
  </div>
  <p id="errorMsg"></p>
  <div id="detailPanel">
    <div class="info-grid">
      <span class="label">注文ID</span>       <span id="dispOrderId"></span>
      <span class="label">顧客名</span>       <span id="dispCustomerName"></span>
      <span class="label">注文日</span>       <span id="dispOrderDate"></span>
      <span class="label">配送先</span>       <span id="dispShippingAddress"></span>
      <span class="label">ステータス</span>   <span id="dispStatus"></span>
    </div>
    <h3>注文明細</h3>
    <table>
      <thead>
        <tr><th>商品ID</th><th>商品名</th><th>単価</th><th>数量</th><th>小計</th></tr>
      </thead>
      <tbody id="itemsBody"></tbody>
      <tfoot>
        <tr id="totalRow">
          <td colspan="4" style="text-align:right;">合計（税込）</td>
          <td class="num" id="dispTotal"></td>
        </tr>
      </tfoot>
    </table>
  </div>

  <!-- 💡 ファイル読み込みをやめて、ここに直接プログラムとダミーデータを合体させました！ -->
  <script>
    const searchBtn      = document.getElementById("searchBtn");
    const orderIdInput   = document.getElementById("orderIdInput");
    const detailPanel    = document.getElementById("detailPanel");
    const errorMsg       = document.getElementById("errorMsg");
    const itemsBody      = document.getElementById("itemsBody");

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = "block";
    }

    function hideError() {
      errorMsg.style.display = "none";
    }

    // 金額を「〇〇円」の形にする関数
    function formatCurrency(amount) {
      return amount.toLocaleString() + "円";
    }

    // 画面にデータを組み立てる関数
    function renderOrderDetail(order) {
      document.getElementById("dispOrderId").textContent        = order.orderId;
      document.getElementById("dispCustomerName").textContent   = order.customerName;
      document.getElementById("dispOrderDate").textContent      = order.orderDate;
      document.getElementById("dispShippingAddress").textContent = order.shippingAddress;
      document.getElementById("dispStatus").textContent         = order.status;

      itemsBody.innerHTML = "";
      let total = 0;

      order.items.forEach(item => {
        // 💡【バグ修正箇所】unitPrise を正しい「unitPrice」に変更してあります！
        const subtotal = item.unitPrice * item.quantity;
        total += subtotal;

        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${item.productId}</td>
          <td>${item.productName}</td>
          <td class="num">${formatCurrency(item.unitPrice)}</td>
          <td class="num">${item.quantity}</td>
          <td class="num">${formatCurrency(subtotal)}</td>
        `;
        itemsBody.appendChild(row);
      });

      const taxRate = order.taxRate || 10;
      const totalWithTax = Math.round(total * (1 + taxRate / 100));
      document.getElementById("dispTotal").textContent = formatCurrency(totalWithTax);
    }

    // 検索ボタンを押したときの動き
    searchBtn.addEventListener("click", () => {
      const orderId = orderIdInput.value.trim();
      hideError();
      detailPanel.style.display = "none";

      if (orderId === "") {
        showError("注文IDを入力してください");
        return;
      }

      // 💡 テスト用のダミーデータ
      const order = {
        "orderId": "ORD-0042",
        "customerName": "田中 一郎",
        "orderDate": "2026-05-20",
        "shippingAddress": "東京都新宿区西新宿1-1-1",
        "status": "処理中",
        "taxRate": 10,
        "items": [
          { "productId": "P-001", "productName": "ノートPC",       "unitPrice": 128000, "quantity": 1 },
          { "productId": "P-007", "productName": "ワイヤレスマウス", "unitPrice": 3800,   "quantity": 2 }
        ]
      };

      // 画面にデータを表示する
      renderOrderDetail(order);
      detailPanel.style.display = "block";
    });
  </script>
</body>
</html>
